# issue-335 Arm B experimental config: quali_pace_gap encoding (v2 schema). Do NOT promote without commander approval.
# Gold module training cycle — authoritative defaults for production gold runs.
#
# This is the single source of truth for all gold-profile training parameters.
# Do NOT duplicate these values in argparse defaults or package constants.
# Research or smoke runs must use a separate profile file.

schema_version = 1
profile_name = "gold_default"

# mode must be one of: "gold", "research", "smoke".
# Gold mode enforces leakage-free behaviour and rejects mutating CLI overrides.
mode = "gold"

[data]
# Explicit train/eval split — never infer the latest season automatically.
# Add the new season to train_years after its data has been fully collected.
train_years = [2018, 2019, 2020, 2021, 2022, 2023, 2024]
eval_year = 2025

# Directory containing f1_data_<year>.db files (relative to repo root).
db_root = "data"

# Root directory for per-year compound prior artifacts (relative to repo root).
compound_prior_root = "params/gold/compound_prior"

# Lap number used to derive the race-start order from lap_times.position.
# Lap 3 is the first lap where safety car effects have typically cleared.
race_start_target_lap = 3

# Root directory for retro-truth BT label JSON files.
# Supervision uses BT posterior means from these files (retro-delta labels).
retro_root = "params/retro_truth"

# Form-channel encoding for recent-history modules (driver/constructor quali power).
# "position_quality" = legacy position-based form (v1 schema, default).
# "quali_pace_gap"   = pace-gap-based form (v2 schema; requires quali_pace_gap_history_full).
recent_history_form_encoding = "quali_pace_gap"

# Compound-normalization regime for the quali-sim (qs_*) practice features (#380).
# The compound fresh-pace effect is regime-dependent: under a qualifying push a
# softer compound is faster fresh; under managed race pace it is not. The
# compound_prior anchor is fit on the race regime.
# "race" = single race-regime beta for all buckets (default; current behaviour).
# "push" = gate-recovered monotone fresh-pace beta for qs_* only; lr_* (long-run)
#          features keep the race-regime beta. See
#          docs/evo/compound_crossover_gate_findings.md for the recovered values.
qs_compound_beta_regime = "race"

[training]
# Training epochs per module.  Raised 25->100 with the median-encoding diagnostic
# (pace-encoding-368): the median-relative feature scale needs more optimizer steps to
# converge than the old minmax [0,1] scale.  Early stopping + restore_best_checkpoint
# trim the real count (observed best-epoch ~60-82), so this is a convergence ceiling.
epochs = 100

# Global random seed for reproducibility across the full gold cycle.
seed = 0

# Learning rate.  Raised 1e-4->1e-3 with the median-encoding diagnostic
# (pace-encoding-368): median-relative features are ~10x smaller in magnitude than the
# old minmax [0,1] features, so 1e-4 under-trained them (quali sign-acc 0.59 vs 0.73 at
# 1e-3).  Validated non-regressive on quali, race, and race-start; restore_best_checkpoint
# guards against any divergence at the higher rate.
learning_rate = 0.001

# Hidden dimension of the latent-power neural net.
hidden_dim = 128

# Dropout rate applied during training.
dropout = 0.2

# Optimizer choice: "adam" or "adamw".
optimizer = "adam"

# L2 regularization weight; 0.0 unless a specific module shows overfit evidence.
weight_decay = 0.0

# Number of epochs without improvement before early stopping triggers.
# Raised 10->15 alongside the epochs/lr bump (pace-encoding-368) to give convergence
# room at the new feature scale before early stopping cuts in.
early_stop_patience = 15

# Restore the checkpoint with lowest validation loss after early stopping.
restore_best_checkpoint = true

# Minimum improvement required to reset the early-stop patience counter.
min_delta = 0.0

# Session-dropout augmentation: number of degraded-evidence variants added per
# training race.  K=0 disables augmentation (full-evidence only, legacy behaviour).
# Each variant randomly drops practice sessions with probability (1 - session_dropout_session_prob).
session_dropout_k = 2

# Per-session retention probability for dropout sampling.  0.7 means each session
# has a 70% chance of being kept in any given variant (min-one guard always applies).
session_dropout_session_prob = 0.7

[uncertainty]
# Pairwise uncertainty calibration over the leave-one-season-out folds.
# This is central to the model — do not disable silently.
enable_sigma_calibration = true

# Weight for the per-pair sigma NLL auxiliary loss (detached Student-t, retro_delta only).
# Co-equal with the mean-head retro_delta loss; post-hoc enable_sigma_calibration remains orthogonal.
lambda_sigma_nll = 1.0

[runtime]
# Number of Monte-Carlo samples for the sampled runtime manifest.
n_samples = 1000

# Copy DBs to output_dir/db_work and materialise race_start_order from lap_times.
# Required for leakage-free gold runs — the production DB must not be mutated.
materialize_race_start_order_from_lap_times = true

# Leave-one-season-out fusion-train row emission.
# Must be "leave_one_season_out" for gold: the static-fusion training step and
# pipeline validation both require the LOSO rows emitted here.
emit_fusion_train_rows = "leave_one_season_out"

# Reject compound priors from the same season as the round being evaluated.
# Must be false for gold mode to prevent data leakage.
allow_same_season_compound_prior = false

# Resource-utilization hint: one of "background", "balanced", "max".
# This is a runtime-only hint — it does not affect results or appear in the run provenance record.
utilization = "balanced"

# Emit per-event module record sidecars for offline fusion experiments; see docs/evo/module_backtest_record.md.
emit_module_record = false

# Quali-head pace anchor (#420): blend the race_weekend quali head's per-module pi
# (before fusion) with a practice min-sector anchor = min(qs_best_raw, lr_best_raw).
# Default OFF; enable only after a gold retrain with anchor active (see docs/evo/prediction_ceiling_and_priorities.md §7.6.4).
quali_pace_anchor_enabled = true
quali_pace_anchor_alpha = 0.5

[outputs]
# Output directory for trained module bundles, working DBs, and manifests.
output_dir = "outputs/evo_runs/gold_module_training_cycle"

# Directory where JSON and Markdown reports are written.
report_dir = "reports/evo"
