work_id    = "<work-id>"
type       = "survey"
config_ref = "docs/agents/engine-config.json"
parent     = "<parent>"

# g2 of epic-559/c2-generate-the-spine: the first real survey role spec.
# Intent matches the shipped skills/reviewer/templates/REVIEW_SURVEY.template.json
# -- seven items, most a bare qualitative record, r6-fowler the one item that
# already carried a real `command` check in the shipped JSON. r6-fowler also
# carries this spec's large claim (see its [gate.claim] below): it is the one
# item whose scope is genuinely the whole diff rather than one narrow question.
#
# Door vocabulary lives in `imperative` and `constraints`, and this comment does
# not. That is not a style choice: generate_spine._compile_gate builds every
# compiled item from a FIXED field list, and compile_spec builds the top level
# the same way, so a new spec key reaches no reader and spec_shape_faults has no
# unknown-key fault to refuse it with -- it would be dropped silently. Comments
# are dropped too. Authored text a reviewer actually reads is `title`,
# `imperative`, `constraints`, a condition `statement`, and a qualitative
# `because` (compile_condition folds it into the statement). Doctrine put
# anywhere else in this file is doctrine nobody is handed.

[[gate]]
id    = "r0-context"
title = "Load baseline context"
imperative = """
Read your inherited global doctrine (this skill's references/global-crew.md and
references/global-everyone.md), then the project deltas if present:
docs/agents/CREW_CONTEXT.md, docs/agents/GLOSSARY.md, plus the handoff, the
diff, and the relevant packet. Record pass when loaded.

THE DOOR IS HOW YOU DRIVE THIS SURVEY, and these items are the survey -- there
is nothing else to drive. A reviewer dispatched with a spine of its own starts
with SPINE_FILE and SPINE_SESSION already in its environment, so the door
resolves to that spine by itself and no session id is passed anywhere. The
survey dialect is not the gated one: spine_status reads where you are,
spine_survey_result records each item pass or fail AND consolidates the verdict
at the end -- spine_advance is the gated plan's closing verb and is not yours --
while spine_evidence, spine_lease, spine_capture, spine_halt and spine_amend
are shared with every other plan. A reviewer dispatched WITHOUT a spine of its
own holds no lease, and an unbound door binds one spine and then drives it
identically -- the identity comes from that spine's own work id, never from a
string you supply.

WHAT YOU MAY NOT DO IS DRIVE A SECOND CHECKLIST FROM THIS PROCESS, and the
reason is a measured refusal rather than an oversight. One door drives one
spine at a time (`decision:one-spine-per-process-stands`). Measured in a fresh
process: with your own lease held, binding a second checklist is REFUSED --
"one door drives one spine at a time ... Release it first" -- and that
escape is not yours to take: your role skill holds the lease open until
your last action, because the lease must cover every journaled action, and
releasing it early fails the terminal provenance check. Dispatched without
a spine of your own you arrive holding no lease -- nothing to release, and
the escape never arises. Read the two halves together and the rule is
one rule, not a limitation: the door reaches the spine you hold a lease on, and
you hold a lease on exactly one. So do not author a survey of your own beside
this one. If these items are wrong for the diff in front of you, that is what
spine_amend and spine_halt are for, and r6-fowler's own REPAIR PATH below is
the worked example.
"""
constraints = [
  "The door is this role's whole interface to its spine -- no session id is passed to it, because this process is already bound to exactly one spine",
  "Author no second survey beside these items: one door drives one spine at a time, and while you hold your own lease the door refuses to bind another -- measured, not assumed",
  "A survey item closes through spine_survey_result, never spine_advance -- the engine refuses the gated verb here",
]

  [[gate.postconditions]]
  id        = "c1"
  statement = "context + glossary + handoff + diff + packet loaded"
  kind      = "qualitative"
  because   = "no doctrine mechanically verifies an agent's comprehension of prose it read; this stated form is what a `record` result of `pass` points at, since a survey item's postcondition list is otherwise empty here"

[[gate]]
id    = "r1-handoff"
title = "Handoff compliance"
imperative = "Did the change do what the handoff asked, within its allowed scope? Record pass/fail with a finding."

[[gate]]
id    = "r2-scope"
title = "Scope drift"
imperative = "Did the change stay inside allowed scope and respect specific exclusions? Record pass/fail with a finding."

[[gate]]
id    = "r3-evidence"
title = "Required evidence"
imperative = "Is the required evidence present and does it actually demonstrate the behavior? Record pass/fail with a finding."

[[gate]]
id    = "r4-quality"
title = "Quality vs inherited rules"
imperative = "Does the change meet the inherited project/section rules (the handoff's constraints)? Append a check per rule. Record pass/fail with a finding."

[[gate]]
id    = "r5-reconciliation"
title = "Reconciliation check"
imperative = "Does the change diverge from the recorded architecture in a way Commander must reconcile? Record pass/fail; flag a triage candidate if it is out of scope."

[[gate]]
id    = "r6-fowler"
title = "Refactoring pass (Fowler code smells)"
imperative = """
Run the refactoring / code-smell pass (SKILL.md 'Refactoring pass'). Render a
verdict on each Fowler baseline smell (long method, large class, duplicated
code, feature envy, data clumps, primitive obsession, long parameter list,
shotgun surgery, divergent change, message chains, speculative generality,
comments-as-deodorant): flagged / overridden / absent. Smells are judgment
calls, ALWAYS subordinate to the repo's documented standards -- an override
needs a logged standard + reason. Record the pass to
.agent-work/<work-id>/FOWLER_PASS.json (from
templates/FOWLER_PASS.template.json), run scripts/verify_fowler_pass.py
.agent-work/<work-id>/FOWLER_PASS.json (it refuses a skipped smell or an
unlogged override), then record pass/fail with a finding. This item's
postcondition command resolves the record path from <work-id> alone -- the
same substitution you already make everywhere else in this survey -- so no
separate placeholder to fill and no way to leave it stale. REPAIR PATH -- only
if the record path ever needs to move off that fixed convention, correct it
through the engine with `spine_amend`, whose `delta` carries the single op
`retext-check` on this item's c1, never by hand-editing this survey. There,
`authority` is the dispatching Commander named in your reviewer handoff (never
a string you invent), and `reason` is why the path changed. Do NOT silently
skip this item.
"""
constraints = [
  "Fowler smells are subordinate to documented repo standards; never hard violations",
  "an override (smell not flagged because a standard wins) needs a logged reason",
]

  [[gate.postconditions]]
  id        = "c1"
  statement = "verify_fowler_pass.py exits 0 on the Fowler-pass record -- refuses a skipped smell or an unlogged override"
  kind      = "script"
  path      = "scripts/verify_fowler_pass.py"
  args      = [".agent-work/<work-id>/FOWLER_PASS.json"]

  [gate.claim]
  magnitude = "large"
  text      = "The Fowler-pass verdict spans the ENTIRE diff, not one narrow question the way the survey's other six items do -- a false 'absent' or an unlogged override lets a real code smell through with no other checkpoint behind it. It is the one item in either role spec whose scope is genuinely broad rather than narrowly targeted, which is why the escalation belongs here and not on a throwaway stand-in."
