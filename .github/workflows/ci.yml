name: CI

# Gate: full tests/ suite green, coverage floor on scripts/checklist_engine.py,
# and a skip-guard that fails the build on any undocumented pytest skip (see
# scripts/verify_skip_guard.py for why message-text-only would be spoofable).
#
# Windows-latest + git-bash `shell: bash` is a documented assumption of this
# workflow (repo's POSIX-shell command-check convention), not something proven
# by a triggered Actions run — see .agent-work/issue-229/crew-handoffs/
# g1-implement-result.md for the local fault-injection proofs that stand in
# for an actual CI run (PR-2b: no Actions run is triggered/waited/claimed).

on:
  push:
    branches: [main]
  pull_request:

env:
  PYTHONIOENCODING: utf-8

jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Full history, not actions/checkout's default depth-1 shallow clone.
          # tests/test_code_map_precommit_e2e.py builds scratch repos with
          # `git clone --bare -- .git`, which fails rc=128 against a shallow
          # clone -- identically on windows-latest and ubuntu-latest.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest coverage

      # Salvaged from PR #555 per issue #575. Named separately from the suite
      # below purely so the Windows evidence is LEGIBLE in the log: "the MCP
      # door launched on Windows and answered a real tool call" becomes a green
      # step with a name, instead of three dots inside 3500.
      #
      # The door used to ship a fixed `"command": "python3"`, which is not a
      # command on a stock Windows host (the python.org installer ships
      # `python.exe`/`py.exe`, and a bare `python3` commonly hits the Microsoft
      # Store app-execution-alias stub) -- and nothing in CI could say so,
      # because every test around it asserted on the config STRING rather than
      # launching what the string names.
      #
      # SCOPE, stated honestly: this proves the interpreter that
      # `${CONSTELLATION_PYTHON:-python3}` RESOLVES TO launches the door on
      # Windows. It does NOT prove Claude Code performs the expansion on
      # Windows -- that is harness behaviour, measured on Linux (see
      # install_constellation.MCP_INTERPRETER_ENV_VAR) and confirmable on a real
      # box with one `claude mcp get spine`. Do not read this step as covering
      # that leg.
      - name: MCP door launches on Windows and answers a real tool call
        run: python -m pytest tests/test_mcp_spine_server.py tests/test_wire_mcp_interpreter.py -v -k "McpJsonVarExpansionLaunch or McpJsonTests or GitTrackedRefusal or ExpandMcpVar"

      - name: Run full test suite
        run: python -m pytest tests/ -q --junitxml=junit-report.xml

      - name: Skip guard -- no undocumented skips
        run: python scripts/verify_skip_guard.py junit-report.xml

      - name: Coverage floor -- scripts/checklist_engine.py
        run: |
          python -m coverage run --include="*/checklist_engine.py" -m pytest tests/test_checklist_engine.py -q && python -m coverage report
          python -m coverage report --fail-under=90

  test-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Full history, not actions/checkout's default depth-1 shallow clone.
          # tests/test_code_map_precommit_e2e.py builds scratch repos with
          # `git clone --bare -- .git`, which fails rc=128 against a shallow
          # clone -- identically on windows-latest and ubuntu-latest.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest coverage

      - name: MCP door launches and answers a real tool call
        run: python -m pytest tests/test_mcp_spine_server.py tests/test_wire_mcp_interpreter.py -v -k "McpJsonVarExpansionLaunch or McpJsonTests or GitTrackedRefusal or ExpandMcpVar"

      - name: Run full test suite
        run: python -m pytest tests/ -q --junitxml=junit-report.xml

      - name: Skip guard -- no undocumented skips
        run: python scripts/verify_skip_guard.py junit-report.xml

      - name: Coverage floor -- scripts/checklist_engine.py
        run: |
          python -m coverage run --include="*/checklist_engine.py" -m pytest tests/test_checklist_engine.py -q && python -m coverage report
          python -m coverage report --fail-under=90
