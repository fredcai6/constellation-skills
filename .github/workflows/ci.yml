name: CI

# Gate: full tests/ suite green, coverage floor on scripts/checklist_engine.py,
# and a skip-guard that fails the build on any undocumented pytest skip (see
# scripts/verify_skip_guard.py for why message-text-only would be spoofable).
#
# Windows-latest + git-bash `shell: bash` is a documented assumption of this
# workflow (repo's POSIX-shell command-check convention), not something proven
# by a triggered Actions run — see .agent-work/issue-229/crew-handoffs/
# g1-implement-result.md for the local fault-injection proofs that stand in
# for an actual CI run (PR-2b: no Actions run is triggered/waited/claimed).

on:
  push:
    branches: [main]
  pull_request:

env:
  PYTHONIOENCODING: utf-8

jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest coverage

      # Named separately from the suite below purely so the Windows evidence is
      # LEGIBLE in the log (#554). These same tests run in the full suite; what
      # this step buys is that "the MCP door launched on Windows and answered a
      # tool call" is a green step with a name, instead of three dots inside
      # 2500. The door used to ship a fixed `"command": "python3"`, which is not
      # a command on a stock Windows host -- and nothing in CI could say so,
      # because every test around it asserted on the config STRING rather than
      # launching what the string names.
      #
      # The cold-review repairs join this selection for the same legibility
      # reason, and one of them carries real platform risk worth naming: the R2
      # test needs a launchable interpreter at a path that is NOT
      # `sys.executable`, and symlink privilege is exactly what a Windows runner
      # may not grant. It tries the symlink and falls back to another spelling
      # of the same real interpreter, so a Windows failure there reads as
      # "neither candidate launches" in a named step instead of one dot in 2500.
      - name: MCP door launches on Windows and answers a real tool call
        run: python -m pytest tests/test_mcp_spine_server.py tests/test_install_constellation.py -v -k "McpDoorLaunchesFromEmittedConfig or McpJsonVarExpansionLaunch or McpReadiness or McpWiring or McpWriteLocation or SpineEngineIsLoadBearing"

      - name: Run full test suite
        run: python -m pytest tests/ -q --junitxml=junit-report.xml

      - name: Skip guard -- no undocumented skips
        run: python scripts/verify_skip_guard.py junit-report.xml

      - name: Coverage floor -- scripts/checklist_engine.py
        run: |
          python -m coverage run --include="*/checklist_engine.py" -m pytest tests/test_checklist_engine.py -q && python -m coverage report
          python -m coverage report --fail-under=90
